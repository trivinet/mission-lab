task_id: ML-TASK-022
title: "Workspace layout shell and scenario editor with validation and derived values (apps/web)"
status: in_progress
requirement_ids: [ML-FR-001, ML-FR-002, ML-FR-005, ML-UX-001, ML-UX-002, ML-UX-004]
owner_role: frontend-engineer
reviewer_role: systems-architect
dependencies: [ML-TASK-020, ML-TASK-021]
affected_paths:
  - apps/web/src/App.tsx
  - apps/web/src/index.css
  - apps/web/src/layout/
  - apps/web/src/editor/
  - apps/web/src/state/          # additions only (element and maneuver setters); no change to the five-state rules
  - apps/web/src/debug/          # the ML-TASK-021 debug surface may be removed once the editor covers its e2e needs
  - apps/web/e2e/
  - docs/backlog/tasks/ML-TASK-022.yaml
objective: >
  Turn the empty shell into the approved workspace (layout A, blue accent, banner plus chip) and
  give it the scenario editor: every input of M1 can be edited, validated at the field and run.
scope:
  - "Layout shell per docs/design/visual-direction.md (approved 2026-11-16) and docs/design/design-tokens.md: editor column left, centre region for the 3D view (an empty, labelled region with a stable container; ML-TASK-023 mounts the scene there), results column right; toolbar with Run and the result-state chip; banner over the centre column for stale, computing, error and none. Tokens as CSS custom properties / Tailwind 4 theme, dark only."
  - "Scenario fields (ML-FR-001 AC2): name, epoch (UTC), duration, output step, each with its unit shown."
  - "Keplerian elements (ML-FR-002): a, e, i, Ω, ω, ν edited in km and degrees, stored in m and rad; field-level validation messages for the AC2 classes (from the engine's validation, not re-implemented); Ω, ω, ν normalised to [0°, 360°); degenerate configurations stated (AC3) using the engine's exported thresholds/convention; derived read-only quantities visually distinct (AC4) computed by the engine's exported functions, never in the UI."
  - "One impulsive maneuver (ML-FR-005): add, edit, remove; time (elapsed, also shown as UTC) and R, S, W Δv in m/s; validation messages including the M1 one-maneuver limit; total |Δv| shown; the RSW convention documented in the UI, including that along-track is not the velocity direction on a non-circular orbit (AC3)."
  - "Result-state presentation (ML-UX-001/002) wired to the ML-TASK-021 store: chip always, banner for stale/computing/error/none; error shows the diagnostics; warnings listed when current."
  - "Keyboard (ML-UX-004): every input and action reachable and operable by keyboard; visible focus."
out_of_scope:
  - "The 3D scene (ML-TASK-023), timeline (024), model panel (025), plots (030–032), persistence (033)."
  - "Any physics or unit conversion beyond the documented display conversions (m↔km, rad↔deg); any change to packages/."
  - "Changing the five-state rules of ML-TASK-021."
  - "New dependencies. If one is needed, stop and report."
inputs:
  - AGENTS.md; docs/engineering/coding-standards.md
  - docs/design/visual-direction.md, docs/design/design-tokens.md, docs/design/mockups/workspace.html (approved)
  - docs/requirements/m1-requirements.md (FR-001, FR-002, FR-005, §3 UX)
  - docs/architecture/contracts-v1.md (Scenario, validation issue paths, diagnostics §8)
  - docs/architecture/adr/ADR-008 (degenerate convention)
  - docs/backlog/tasks/ML-TASK-021.yaml (report: store API)
  - packages/contracts, packages/simulation, packages/astrodynamics public exports (read only)
acceptance_criteria:
  - "`pnpm install --frozen-lockfile`, `pnpm lint`, `pnpm typecheck`, `pnpm test`, `pnpm build`, `pnpm format:check`, `pnpm check:boundaries` exit 0; `pnpm --filter @mission-lab/web test:e2e` passes, including the ML-TASK-021 VE-02 and ML-UX-003 tests (adapted to the editor if the debug surface is removed, with the same assertions)."
  - "Unit tests: display conversions round-trip exactly where they must (stored values are what the user typed, converted once); angle normalisation; mapping of each engine validation issue path to its field."
  - "e2e: edit each field class; each FR-002 AC2 validation class shows a field-level message and prevents the run; a degenerate orbit shows its convention note; add, edit and remove a maneuver; the second-maneuver message; derived values shown and distinct; keyboard-only run of the default scenario."
  - "No physics computed in apps/web: derived quantities and validation come from engine exports (reviewable in the diff)."
test_requirements:
  - "Vitest unit tests in apps/web/src; Playwright e2e in apps/web/e2e."
deliverables:
  - apps/web layout shell, editor, tests; the report section of this file
human_approval_required: false

report:
  files_changed:
    - "apps/web/src/App.tsx, index.css (tokens as CSS custom properties, dark only), layout/ (Toolbar, ResultStatus chip and banner, CenterRegion, ResultsColumn)"
    - "apps/web/src/editor/ (Fields, ScenarioPanel, ManeuverPanel, DerivedPanel, issue-map, useIssues) and format/units.ts (m<->km, rad<->deg, UTC label)"
    - "apps/web/src/state/scenario-store.ts: additions only (setElement, addManeuver, setManeuverTime_s, setManeuverDeltaV_mps, removeManeuver); five-state rules untouched"
    - "apps/web/src/debug/DebugSurface.tsx removed; e2e/result-states.spec.ts adapted; e2e/editor.spec.ts new"
  summary: >
    Layout A shell (editor, centre, results), toolbar with Run and result chip, banner for none,
    computing, stale and error. The centre region has data-testid scene-region and an empty
    scene-container for ML-TASK-023. All scenario fields and the six elements are editable in
    km and deg (converted once, stored SI); validation is live from the engine's
    buildSimulationRequest, shown per field with the engine's code and message. One maneuver can
    be added, edited and removed, with a UTC label and the RSW note. PARTIAL: derived quantities,
    the degenerate-orbit note and angle normalisation are NOT done (see risks_or_blockers).
  engine_exports_used:
    - "@mission-lab/simulation: buildSimulationRequest (validation and request)"
    - "@mission-lab/contracts: types; the M1 one-maneuver message comes via validation (MANEUVER_COUNT_EXCEEDED)"
    - "Result events: ManeuverEvent.deltaV_magnitude_mps for total |dv| (shown after a run)"
  acceptance_mapping:
    - "AC1 pnpm install --frozen-lockfile, lint, typecheck, test, build, format:check, check:boundaries and web e2e exit 0; 26 e2e passed, VE-02 and ML-UX-003 adapted with the same assertions (state read from data-state)"
    - "AC2 unit: format/units.test.ts (conversions, typed-once round trip), editor/issue-map.test.ts (engine issue classes mapped to fields, real engine), state/editor-setters.test.ts (setters stale the result). Angle normalisation test NOT done (blocked)"
    - "AC3 e2e: editor.spec.ts covers editing each field class, 13 validation classes plus perigee, maneuver add/edit/remove, second-maneuver message, keyboard-only run. NOT covered: degenerate convention note, derived values distinct (blocked)"
    - "AC4 no physics in apps/web: the diff has only unit scaling and a Date addition for the UTC label"
  tests_executed:
    - "pnpm install --frozen-lockfile, lint, typecheck, test, build, format:check, check:boundaries: exit 0"
    - "pnpm --filter @mission-lab/web test:e2e: 26 passed (Chromium, built app)"
    - "Looked at the built app in the Browser pane at 1440 px and narrow widths: layout, units, current chip"
  not_verified:
    - "Contrast of italic stale values not measured; no colour-blind check; Firefox and Safari not run"
    - "Keyboard operation checked by Chromium e2e only, no screen reader pass"
    - "Each keystroke edits the store, so the result goes stale per keystroke"
  known_limitations:
    - "Add maneuver can be pressed twice; the second shows the engine's MANEUVER_COUNT_EXCEEDED message and blocks the run until removed"
    - "UTC label of the maneuver time is epoch + t_s by Date (documented time convention, no leap seconds); a display date addition, flagged for review"
    - "Total |dv| appears only after a run (engine value)"
  risks_or_blockers:
    - "BLOCKER: ML-FR-002 AC3 and AC4 and angle normalisation need closedOrbitQuantities, the degeneracy thresholds and DegenerateConvention, and normalizeAngle_rad. They live only in @mission-lab/astrodynamics. apps/web may import only simulation and contracts (eslint boundaries, ADR-002, fixture web/imports-astrodynamics) and simulation does not re-export them. Not reimplemented. DerivedPanel shows dashes and a not-available note. Needed: re-export from simulation, or a decision to allow web to astrodynamics. The approved 1e-5 thresholds (ADR-008, tolerances.md section 15) are also needed as an export."
    - "Angles outside [0, 360) deg currently get the engine's ANGLE_OUT_OF_RANGE field message instead of being normalised (FR-002 AC2 says normalised)"
  documentation_changes: []
  recommended_next_action: "Decide the export route for derived quantities, degeneracy and angle normalisation; then a small follow-up completes FR-002 AC3, AC4, normalisation and the missing tests."
