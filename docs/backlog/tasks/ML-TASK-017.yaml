objective: >
  Turn a Scenario into a SimulationRequest with its requestId, and a SimulationRequest into a
  contract-conforming SimulationResult, exactly as contracts-v1 revision 4 specifies: semantic
  validation (§3), request building and SHA-256 requestId (§4, §7), the normative sampling grid and
  segment split (§5.2), the maneuver event (§5.3), model metadata (§5.4), invariants R1–R13 (§5.5),
  the engine boundary and failed results (§6), and runtime diagnostics with the owner-approved
  escape/intersection semantics (§8.3, §11.3).
