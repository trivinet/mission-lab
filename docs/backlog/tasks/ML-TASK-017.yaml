  summary: >
    Semantic validation (contracts-v1 §3): r_p = a·(1 − e) evaluated as written must be > the
    engine reference radius (EARTH_CONSTANTS), else PERIGEE_BELOW_REFERENCE_RADIUS at
    ["initialOrbit","elements"]; the §5.2 sample count (computed analytically from the defining
    products fl(j × h), never by enumerating, so 1e300/1e-300 is rejected instantly) above
    PROVISIONAL_MAX_SAMPLE_COUNT gives SAMPLE_COUNT_EXCEEDED at ["outputStep_s"].
    Request building (§4): validateScenario → validateScenarioSemantics → elementsToState(elements,
    EARTH_CONSTANTS.mu_m3ps2) → constants copied from EARTH_CONSTANTS → epoch, maneuvers, duration,
    step copied unchanged → requestId = "sha256:" + hex SHA-256 of UTF-8(canonicalRequestPayload)
    → self-check with validateSimulationRequest. deriveRequestId(scenario) is the §7.4 staleness
    key. SHA-256 is implemented in the package from FIPS 180-4; K and H(0) are computed from their
    definitions with exact BigInt integer roots and checked against the tables of the standard.
    Grid (§5.2): candidates j × h (one multiplication) while < D, plus D, plus maneuver times with
    === de-duplication (the sample takes the maneuver's value, so −0 survives), sorted; segment n =
    { t : b_n ≤ t ≤ b_{n+1} }. Run: request validated (structural problems → issues, no result);
    engine backstop on the sample count; segment 0 from request.initialState; first sample of every
    segment copied from its initial state; every other sample propagateKeplerUniversal(μ, r_n, v_n,
    t − b_n) independently; at a maneuver the last sample of segment n goes through
    applyImpulsiveManeuver, the event copies its fields, segment n+1 starts from (position,
    velocityAfter); then classifyEscape and detectReferenceSphereIntersection (span = Δt of the
    post-maneuver segment's last sample) emit the warnings with t_s = maneuver time; any numerical
    failure (including a failed intersection check, D8) yields a failed result (no segments, no
    events, warnings found earlier kept, then the error). Each typed array owns its own buffer.
    Every result is passed through validateSimulationResult before it is returned; a violation
    (engine defect) is replaced by a failed INTERNAL_ERROR result. Maneuvers are processed as a
    time-ordered list (M1 validator limits it to one).
  sha256_sources:
    - "Opened 2026-11-13: FIPS PUB 180-4, https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.180-4.pdf — §2.2.2, §3.1–§3.2, §4.1.2 Eqs. 4.2–4.7, §4.2.2 (K table), §5.1.1, §5.2.1, §5.3.3 (H(0)), §6.2.1–§6.2.2, Appendix A.2 (pointer to the NIST examples)."
    - "Opened 2026-11-13: NIST CSRC 'SHA256.pdf' example (One Block Message 'abc', Two Block Message 'abcdbcdecdefdefgefghfghighijhijkijkljklmklmnlmnomnopnopq'), https://csrc.nist.gov/CSRC/media/Projects/Cryptographic-Standards-and-Guidelines/documents/examples/SHA256.pdf — final digests transcribed into sha256.test.ts."
    - "Constants: computed in code (K_t = floor(cbrt(p_t·2^96)) mod 2^32; H(0)_i = floor(sqrt(p_i·2^64)) mod 2^32, BigInt Newton integer roots, primes by trial division) and compared in the test with the hexadecimal tables of §4.2.2 and §5.3.3 transcribed from the opened PDF. No constant was typed from memory."
    - "Differential test against Node's crypto (and UTF-8 against Node's Buffer) in sha256.test.ts and request.test.ts only, reached through process.getBuiltinModule at test time; package source uses no platform API."
  points_for_owner_decision:
    - "P1 Sample-count limit: PROVISIONAL_MAX_SAMPLE_COUNT = 1 000 000 total samples (sum over segments) is a PLACEHOLDER, not a measurement (ML-NFR-004 requires Phase 2 measurement). Rationale: 7 binary64 per sample = 56 MB of typed arrays at the limit; 30 days at 10 s is 259 201 samples. Needs owner approval or replacement after measurement. The value also appears in model.limitations."
    - "P2 t_s of REFERENCE_SPHERE_INTERSECTION (left open by contracts-v1 §11.3): proposed and implemented = the maneuver time (start of the flagged post-maneuver arc), same as ESCAPE_TRAJECTORY. Alternatives: the time of the condition (start → m, periapsis → m + t_p, end → D), which is a rounded non-sample time and close to the first-crossing time D6 excludes; or no t_s."
    - "P3 NQ-1 (−0 normalisation): NOT implemented. The contract text records it as an open owner question with a recommendation ('Decide in ML-TASK-017'), which I did not read as authorisation. −0 inputs are copied unchanged, so a −0 Δv component or maneuver time gives a different requestId than +0 (tested). If the owner approves the recommendation, the change is local to buildSimulationRequest."
    - "P4 Contract gap — overflowing initial state: a structurally and semantically valid scenario with an extreme a (e.g. 1.7e308, e = 0.9) makes elementsToState fail (NON_FINITE_RESULT). No code covers this; implemented as one ValidationIssue NON_FINITE_NUMBER at ['initialOrbit','elements']. Alternatives: a new semantic code, or an upper bound on a."
    - "P5 Mapping of failures without a dedicated code: classifyEscape / detectReferenceSphereIntersection NON_FINITE_RESULT (overflow of a derived quantity) → NON_FINITE_STATE (error, t_s = maneuver time); intersection PROPAGATION_FAILED → the propagator's own code (D8); propagator INVALID_INPUT, maneuver ZERO_POSITION / ZERO_ANGULAR_MOMENTUM (rectilinear pre-maneuver state, not reachable from a scenario, contracts-v1 §8.3 note) and unexpected exceptions → INTERNAL_ERROR."
    - "P6 Warnings are evaluated only after maneuvers (contracts-v1 §8.3 'post-maneuver'). A request built WITHOUT the semantic check (not from a scenario) whose initial orbit intersects the sphere or escapes gets no warning on segment 0. Unreachable from a scenario."
    - "P7 runSimulation self-validates every result (O(total samples)); the worker host would otherwise validate it again before transfer (contracts-v1 §6 'Realm'). Keep, or move to the worker only."
    - "P8 runSimulation does not recompute the request's requestId; a request with a well-formed but wrong id is run and the result carries that id. Contract does not require the check."
    - "P9 model.engineVersion = PACKAGE_VERSION of packages/astrodynamics, currently '0.0.0' and never bumped. contracts-v1 §7.1 scopes 'equal requestId ⇒ equal result' to one engineVersion, so a persistent cache keyed on (requestId, engineVersion) would not see engine changes until a versioning policy exists."
    - "P10 model.limitations wording (model.ts MODEL_LIMITATIONS): restates architecture §3 / ADR-004 / contracts-v1 §5.4 items, adds 'Not qualified for operational spacecraft navigation' (ML-SYS-001 §5.7 last line, ML-FR-012 AC3). Owner/Docs review of the text."
