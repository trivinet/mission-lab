    - "apps/web/src/state/default-scenario.ts (new): DEFAULT_SCENARIO_VALUES, newScenario()"
    - "apps/web/src/state/result-state.ts (new): five-state machine, pure transitionResult"
    - "apps/web/src/state/scenario-store.ts (new): zustand vanilla store (createScenarioStore, getScenarioStore), setters, run(), validation issues per field path"
    - "apps/web/src/worker/protocol.ts, run-handler.ts (pure worker logic), simulation.worker.ts (module worker plumbing), worker-runner.ts (host: lazy worker, run ids, error handling) (new)"
    - "apps/web/src/debug/DebugSurface.tsx (new), apps/web/src/App.tsx (modified): plain debug surface with data-testid attributes"
    - "apps/web/src/state/*.test.ts, apps/web/src/worker/*.test.ts (new): 56 unit tests"
    - "apps/web/e2e/result-states.spec.ts (new): VE-02, validation issues, ML-UX-003"
    - "docs/backlog/tasks/ML-TASK-021.yaml: this report"
  summary: >
    One store holds the Scenario, the result state and the validation issues. run() builds the
    request on the main thread with the engine's buildSimulationRequest (validation, state
    conversion, requestId; no physics in the UI) and sends it to a Vite module worker that calls
    runSimulation. Typed-array buffers are transferred. Every message carries a run id; a result
    is applied only while the state is computing with that same id, so a superseded run, a run
    discarded by an edit, or one discarded by newScenario() is ignored. The worker logic is the
    pure handleRunMessage; the host (createWorkerRunner) takes a worker factory so tests inject a
    double. Transition table: see result-state.ts header (reproduced in the hand-off message).
    The default scenario values are listed below for owner confirmation.
  default_scenario_values_for_owner_confirmation:
    note: "Product default, not a physical reference. Source of truth: DEFAULT_SCENARIO_VALUES in apps/web/src/state/default-scenario.ts. mu and the reference radius are not set by the UI; the engine supplies them."
    name: "New scenario"
    epoch: "2026-01-01T00:00:00.000Z (UTC)"
    semiMajorAxis_m: "7 000 000 m"
    eccentricity: "0.01 (dimensionless)"
    inclination_rad: "pi/4 rad (45 deg)"
    raan_rad: "0 rad"
    argPeriapsis_rad: "0 rad"
    trueAnomaly_rad: "0 rad"
    maneuvers: "none"
    duration_s: "6000 s"
    outputStep_s: "60 s (101 samples)"
  tests_executed:
    - "pnpm install --frozen-lockfile: 'Lockfile is up to date', exit 0"
    - "pnpm lint (eslint .): no problems, exit 0 (after fixing two e2e findings)"
    - "pnpm typecheck: all packages Done, exit 0"
    - "pnpm test (vitest run): 73 files, 1630 tests passed (apps/web project: 6 files, 57 tests, of which 56 new and 1 existing placeholder)"
    - "pnpm build: ok (the worker is emitted as its own asset, simulation.worker-*.js, 121 kB)"
    - "pnpm format:check: All matched files use Prettier code style!"
    - "pnpm check:boundaries: 20/20 fixtures reported ok (react/zustand outside apps/web still forbidden, apps/web may not import astrodynamics)"
    - "pnpm --filter @mission-lab/web test:e2e (Chromium, built app): 4 passed (smoke; VE-02; validation issues per field; ML-UX-003)"
    - "Mutation check of the ML-UX-003 test: temporarily running the engine on the main thread made the test fail (state never observed as computing; page blocked); change reverted, not committed"
    - "ML-UX-003 measurement in the passing run: 600 001-sample run, max gap between animation frames during the run 16.8 ms"
  reference_data_used: []
  not_verified:
    - "ML-UX-003 shows responsiveness on one machine in headless Chromium. The max frame gap is an observation, not a budget; a slower machine or a larger run is not covered. The e2e test cannot prove the engine runs only in the worker; that rests on code structure (only simulation.worker.ts and the pure run-handler call runSimulation; the store calls buildSimulationRequest only)."
    - "Transfer without copying is verified with structuredClone({transfer}) in Node (source buffers detach), not by observing a real postMessage in the browser."
    - "Behaviour with a worker that crashes in a real browser (onerror path) is tested with a test double only."
    - "Firefox and Safari not run (Chromium only, per the e2e config); module workers are used."
    - "No manual keyboard or visual review of the debug surface (it is deliberately unstyled; ML-UX-004 belongs to ML-TASK-022)."
  known_limitations:
    - "ML-FR-001 AC3 (confirm before replacing an unsaved scenario) is DEFERRED: it needs the unsaved-changes tracking of ML-TASK-033. startNewScenario() replaces the scenario without confirmation."
    - "Latest wins is by discarding results, not by cancelling: an earlier run keeps the single worker busy until it ends and a later run queues behind it. Terminating and re-creating the worker on supersede is a possible follow-up if long runs are re-run often."
    - "Editing a physical parameter while in the error state leaves the error state (the diagnostics belong to the failed run) until the next run; the contract does not say. Editing while stale or none leaves the state unchanged."
    - "Physical setters in this task: epoch, duration, output step (as the contract lists). Orbit elements and maneuvers arrive with ML-TASK-022; they must call the same PHYSICAL_EDIT path."
    - "Staleness is by field edit, not by comparing requestId (contracts-v1 s7.4 allows the latter); reverting an edit does not restore current."
    - "A stale result produced by an edit during computing carries no result (result: null)."
    - "The contract text says a run 'returns status: succeeded'; the contract's actual value is 'ok'. Implemented and tested as 'ok'."
    - "Validation is run on the main thread through buildSimulationRequest (cheap; no propagation), so issues appear immediately and the worker only receives a valid request."
  documentation_changes: []
  risks_or_blockers:
    - "None blocking. The default values need the owner's confirmation at review."
    - "Large runs (up to the provisional 1 000 000-sample limit) hold a few tens of MB of typed arrays in the result state; ML-NFR-004 measurement is Phase 2."
  review_artifact: ""
  recommended_next_action: "Systems Architect review, then owner review of the default scenario values and of the error-state edit decision; ML-TASK-022 (editor) and ML-TASK-023..025 can then build on the store."
