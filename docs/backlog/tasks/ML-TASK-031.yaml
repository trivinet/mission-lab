    - "The flat-history unit test uses ad-hoc smoke bounds (1e-9 relative / 1e-9 rad), not approved tolerances."
    - "Whether the UI's plotting library accepts null gaps as returned (ML-TASK-030)."
    - "Performance of computeHistories on results near PROVISIONAL_MAX_SAMPLE_COUNT (not measured)."
  known_limitations:
    - "Flight-path angle and mean anomaly histories are missing (no astrodynamics function)."
    - "ν, Ω, ω histories are the values reported under the per-sample ADR-008 convention (e.g. ν = argument of latitude on a CIRCULAR sample); the segment's convention array says which."
    - "The coast result does not enter the table values: 'before' is the R8 pre-maneuver state of the maneuvered run (same orbit as the coast run, which starts from the bit-identical initial state)."
    - "r_p is reported only for closed orbits (closedOrbitQuantities); the hyperbolic periapsis radius is not provided."
  documentation_changes: []
