    - "Rendering on a real GPU (the run used software WebGL, SwiftShader)."
    - "Process-level memory (worker arrays, GPU buffers); only main-page JS heap was read."
    - "Any machine other than the one recorded; one session only."
    - "Deterministic maneuver ids (blocked, see risks_or_blockers)."
  known_limitations:
