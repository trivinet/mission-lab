  risks_or_blockers:
    - "A4a blocked: scenarioSchema (packages/contracts/src/scenario.ts) is z.strictObject with no maneuver-counter field, and the contracts may not be changed in this task. Maneuver ids are still crypto.randomUUID() in apps/web/src/state/scenario-store.ts, so two identical scenarios built independently get different requestIds. Needs a contract decision (add an optional counter field, or define the id as derived from the scenario, e.g. next free 'm<k>' over the existing ids, which needs no new field)."
    - "The sample limit decision is the owner's (part B)."
  review_artifact: ""
  recommended_next_action: >
    Verification Engineer reviews the envelope record; owner decides the limit and the maneuver-id
    contract question; then part B.
