      - "N3: §4.1 item 6 lists the superseded fields: assertion, assertionReason (vt-16-r4, l3-r4-vt-16 segment1) and comparedWith of l3-r4-vt-16/c1."
      - "N4: asserted, gated: engine c1 event position_m and velocityBefore_mps bit-identical to initialState; ‖Δv_I,engine − Δv_I,Orekit‖ ≤ the approved L3 VT-12 row 3M(12κ_h + 25)u‖Δv‖ = 1.972e-10 m/s (κ_h = 1, ‖Δv‖ = 4000 m/s; binary64 and decimal). Deviation from the note: see disagreements."
      - "N5: recordApprovesRev5 accepts revision ≥ 5 with status 'Approved by the owner on DATE', or revision ≥ 6 whose header says 'Revision 5 was approved by the owner on DATE'; refuses revision 5 Proposed and revision < 5 (unit tests). Switch kept until phase 2; after the phase-2 report is accepted the switch is removed and the tests run in pnpm test and CI (record §4.1 item 6, README, gate doc comment)."
      - "N6: §9.3.1 w stated as w = 1 on both L3 arcs (with the numbers); VT-16 L3 row no longer says 'toleranced only if …'; §4.1 item 5 says the L3 datasets were run in run 3 with values committed before."
      - "N7: 50 of 144 grid arcs have r_min < R_ref (15 of the first 96, 35 of the supplement; 32 start inside R_ref); the check calls propagateKeplerUniversal directly; a rejection would be a test-design artefact."
    loosenings: "None. No approved value changed; the only new values are the 48 added grid thresholds."
    tests_executed:
