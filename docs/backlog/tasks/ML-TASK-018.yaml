report_part_d1:
  # Part D1 (2026-11-15), branch docs/ml-task-018d-tolerances-rev4, not pushed. Engine not read, not run.
  commits:
    - "ca60e1b record rev 4: VT-14 scope, VT-15 general burns and plane, VT-16 hyperbolic budget (§6.8), VT-09 exact"
    - "141af0c record rev 4: L3 Orekit rows (§9.3.1), maneuvers at t > 0 (§9.3.2), open items, approval table"
    - "this commit: part D scope and this report"
  files_changed:
    - docs/verification/tolerances.md (revision 4, Proposed)
    - docs/backlog/tasks/ML-TASK-018.yaml (scope part D, this report)
  summary: >
    Revision 4 of the tolerance record. P-1: VT-14 accepted for G1 at e = 0 only, O-11 open and not
    blocking. P-2: VT-15 error model gains term (iv), the direction error of the computed Δv_I
    (|δE⁺| ≤ v⁺(12κ_h⁻ + 25)u‖Δv‖); new a⁺/e⁺ rows for normal, radial and combined burns
    (1.55e-14…2.91e-14 relative, 2.98e-14…3.08e-14 absolute), plane-normal (6.4e-15…6.5e-13 rad) and
    plane-rotation (2.6e-14…6.7e-13 rad) rows for all 14 cases; comparison modes A (exact pre-state,
    m = 0 or tangential at an apsis) and B (engine event state, any m). The magnitude part of term
    (iv) also applies to tangential burns; the approved values still bound the corrected formula
    (after review: no loosening, see review_fixes). P-3: hyperbolic
    componentwise budget written out and evaluated (§6.8); 10κ_E·a replaced by 10κ_E·r_max (|a| does
    not bound r on a hyperbola); C_b recounted for cosh/sinh (+2u|a| terms). Only c3-midrun-escape meets
    the approved validity condition |E| ≥ 0.1(v²/2 + μ/r) (M·P_E,gen 4.551e-6 m at the end of the L2 arc, after review B3);
    lowering it to 0.05 is proposed to the owner. O-5 closed. P-4: O-4 resolved on ADR-005 (Decision)
    plus the ML-TASK-015 contract (scope item 2, acceptance criterion 4), reading stated; VT-09 exact.
    L3: rows 3M × per-side bound for VT-02, VT-12, VT-15 and hyperbolic VT-16 (A6 confirmed for
    elliptic propagation by selfcheck.py; new assumption A6′ for the other Orekit computations);
    maneuvers at t > 0 handled by restarting Orekit from the engine's event state (transport factors
    do not exist for these arcs).
  tests_executed:
    - "Independent arithmetic: every revision-4 number computed by a Node.js v24.22.2 binary64 script and by a separately written Python 3.13.17 decimal script (50 digits); agreement to the four printed digits. Scripts kept in the session scratchpad, not in the repository."
    - "Transcription check: the binary64 script reproduces the approved §6.6 values (P_b, V_b, P_E, V_E for C1…C6) and the ten approved VT-15 values stored in test-data/reference-cases/vt-15 to four digits."
    - "Precondition check on data (no engine): in all 20 m = 0 L3 files of vt-12, vt-15, vt-16 the event position and velocityBefore equal the requestBody initialState (JSON equality)."
    - "pnpm format:check → exit 0 (All matched files use Prettier code style)"
  reference_data_used:
    - "Inputs and reference-side outputs of test-data/l3-orekit/ (Orekit 13.1.9) and test-data/reference-cases/vt-15, vt-16 (event states, post-maneuver energies, elements); grid elements from verification/l3/cases.py"
    - "conformance-run-2.md measured values and selfcheck.py informational values: read, used only as a non-contradiction check after evaluation, never to set a value"
  not_verified:
    - "Hyperbolic solver residual (O-12): ε_t,gen assumes the engine's solve ends at the noise level for E > 0; O-1 check and δt_α exist for e < 1 only."
    - "A6′ for Orekit's hyperbolic propagation (O-13): informational only; L3 VT-16 hyperbolic rows not usable until selfcheck has a pass/fail check."
    - "VT-14 for e > 0 (O-11, by owner direction)."
    - "Non-tangential VT-15 burns at m > 0 in mode A (phase term not derived; mode B required)."
    - "Literature citations of the record that were already 'to be confirmed' (Higham, Curtis, Vallado, Hairer, IEEE 754, ECMA-262) are unchanged; no new literature value was introduced."
  known_limitations:
    - "The O-4 resolution rests on reading ADR-005's 'computed directly from the segment's initial state at Δt' as excluding other inputs; the explicit 'no warm start' is in the propagator task contract, not in the contract or the runner's task contract."
    - "Four of the six hyperbolic arcs (ratio 0.055–0.079) have evaluated values but stay warnings-only unless the owner lowers the validity condition to 0.05."
    - "The L3 files carry stored tolerances that differ from the revision-4 rows (record C-8); D2 must use the record."
  documentation_changes:
    - docs/verification/tolerances.md (revision 4)
  risks_or_blockers:
    - "Revision 4 needs the owner's signatures in §15 before D2 may run the engine on the gaps or on the L3 datasets (§4.1)."
    - "Outside this part's paths: ML-TASK-015.yaml status reads in_review although the task is done (C-7); selfcheck.py hyperbolic pass/fail check (O-13)."
  review_artifact: "PR #31 (pushed by the Coordinator)"
  recommended_next_action: >
    Systems Architect re-check of the review fixes; owner: sign the revision-4 rows of §15 and the
    0.1 → 0.05 validity decision. Then part D2: extend selfcheck.py (O-13), produce new versions of
    the L2 VT-15 and VT-16 datasets with the revision-4 values (§4.1 item 5), the L2b hyperbolic
    trajectories and the L3 restart arcs, commit datasets with their evaluated tolerances and the
    comparison code, then run the engine.
  review_fixes:
    # Systems Architect bounded review of PR #31, verdict "changes required"; fixes 2026-11-15, not pushed.
    commits:
      - "a85dd25 Q3/N1: C3 loosening withdrawn; term (i) zero at m = 0; general e⁺ formula for e⁺ < 1e-6"
      - "b8e0096 B1: mode A at m > 0 only for tangential burns at an apsis (all VT-15 rows)"
      - "9d49a10 B2: §4.1 item 5 — revision-4 values only for new dataset versions; run-2 datasets informative"
      - "bf24cfc B3/N4: χ²C row 7 → 8; hyperbolic values re-evaluated; arc-wide per-sample convention"
      - "c3d0068 N2/N3: start-of-arc validity test stated as a scope gate; VT-14 G1 wording"
      - "this commit: report"
    resolution:
      - "B1: mode A at m > 0 restricted to tangential burns at an apsis for every row incl. the plane rows; every other burn at m > 0 uses mode B (consistent with §9.3.2 item 4); §15 row updated."
      - "B2: remedy (a) as new §4.1 item 5, repeated in §7 VT-15 (table columns 'run-2 dataset' and 'new version'), §7 VT-16 and §15. L2 hyperbolic VT-16 arcs treated the same way."
      - "Q3: agreed. At m = 0 term (i) is zero; corrected formula for c3-apogee-circularise = 143.7u = 1.595e-14 (verified in binary64 and decimal), bounded by the approved 1.7686e-12; e⁺ (general formula, N1) 3.93e-14 ≤ 1.7952e-12. Approved values stay for the run-2 dataset; loosening rows removed from §15 and the change paragraph."
      - "B3: coefficient 7 → 8; both scripts re-run; inbound M·P_E,gen 2.2225e-5 → 2.2341e-5 m, outbound 1.2653e-5 → 1.2691e-5 m, as the reviewer found; escape-clear and L3 C1 unchanged (sinh F₀ = 0)."
      - "N1: chose 'general e⁺ formula for e⁺ < 1e-6' rather than adding the term everywhere: the radial part changes ‖e⁺‖ at first order only when e⁺ is of the size of the perturbation (≤ 1e-14); for e⁺ ≥ 1e-6 it is ≤ 5e-23 (second order). Adding it everywhere would raise approved values for a term that does not act there. The general formula contains the reviewer's term. Affects c3-apogee-circularise only (L2 new version 3.93e-14; L3 6.78e-14 → 7.80e-14)."
      - "N2: stated that the start-of-arc test is a scope gate the bound does not need (factors taken over the whole arc; inbound reaches 0.0411 at periapsis)."
      - "N4: per-sample values use arc-wide r_max, r_min, v_max, g_max, κ_E; D2 uses the same convention."
      - "N3: VT-14 text says the G1 report must state exactly 'VT-14: e = 0 only'."
    tests_executed:
      - "Node binary64 and Python decimal scripts re-run after the B3 and Q3/N1 changes; agreement to four digits."
      - "pnpm format:check → exit 0"
    disagreements: []

