    disagreements:
      - "N4 bound: the note asked for ≤ 2 × the VT-12 per-side bound, i.e. 2(12κ_h + 25)u‖Δv‖ = 3.29e-11 m/s, unmargined. I used the approved L3 VT-12 row 3M(12κ_h + 25)u‖Δv‖ = 1.972e-10 m/s instead: it is already approved for exactly this quantity (engine Δv_I vs Orekit Δv_I, §9.3.1), and an unmargined bound would be a new tolerance outside the margin policy of §3. Not a loosening (no approved value existed for 2× per side). The choice was not driven by the run-3 value (1.8e-12 m/s), which both bounds pass. If the reviewer prefers the tighter form, it is a one-line change in the gated test before phase 2."

