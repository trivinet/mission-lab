task_id: ML-TASK-007
title: "Fold Appendix A amendments into the body of ML-SYS-001 (v0.3), no change of meaning"
status: in_review            # proposed | ready | in_progress | in_review | done | blocked
requirement_ids: []         # none: the task changes the specification text itself (ML-SYS-001 v0.2 Appendix A, F-01..F-18, A.2)
owner_role: docs-release
reviewer_role: systems-architect
dependencies: [ML-TASK-001]
affected_paths:
  - docs/product/ML-SYS-001.md
  - docs/backlog/tasks/ML-TASK-007.yaml   # report section only
objective: >
  Produce ML-SYS-001 v0.3 by stating every Appendix A amendment (review findings F-01..F-18 and
  roadmap additions A.2) in the body text of docs/product/ML-SYS-001.md, without adding, strengthening,
  weakening or reinterpreting anything beyond the amendments, and replace Appendix A with a
  traceability table.
scope:
  - Edit only the body sections affected by an amendment.
  - Bump the version to 0.3 and add a change log entry.
  - Replace Appendix A with a traceability table (one row per F-01..F-18 and per A.2 item, mapped to
    the body section(s)). The v0.2 wording is recoverable from git history (commit 644b1af).
  - Items whose application is ambiguous, or that conflict with another source, are left unchanged and
    listed as open questions in the task report.
out_of_scope:
  - Any change to code, tests, ADRs, tolerances, verification reports or other documents.
  - Deciding the open questions listed in the report.
  - Editing text that no amendment affects.
inputs:
  - AGENTS.md
  - docs/product/ML-SYS-001.md (v0.2, commit 644b1af)
  - docs/product/ML-SYS-001-review.md (F-01..F-18 and their resolutions)
  - docs/agents/task-template.yaml
  - docs/architecture/proposed-architecture.md (§2 and §4, cited by F-09 and F-10)
  - docs/releases/G0-review.md (decisions D-1..D-9, used to confirm approval of amendments)
acceptance_criteria:
  - Every F-01..F-18 resolution and every A.2 item is stated in the body of ML-SYS-001.md (VT: none; documentary check).
  - Appendix A contains one traceability row per F-01..F-18 and per A.2 item, each mapped to a body section (26 rows).
  - Version is 0.3 and a change log entry exists.
  - The diff against v0.2 changes only the body sections affected by an amendment, the version/status header, the change log and Appendix A.
  - Items not folded or conflicting are listed in the report, not decided.
test_requirements:
  - Re-read the final file and check each traceability row against the body text.
deliverables:
  - docs/product/ML-SYS-001.md (v0.3)
  - docs/backlog/tasks/ML-TASK-007.yaml (this file, report filled)
human_approval_required: true   # the spec text is owner-approved baseline material; the owner reviews the diff before v0.3 is treated as authority

