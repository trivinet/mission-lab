  - Degree conversion and any display formatting (UI layer).
  - Kepler propagation (ML-TASK-015), maneuvers, escape/surface flags and simulation runner (ML-TASK-016/017).
  - Alternative (non-singular) element sets (ADR-008 option C).
  - Any edit to verification/, test-data/, tolerances, or package dependencies.
