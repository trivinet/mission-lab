task_id: ML-TASK-014
title: "Keplerian elements <-> Cartesian state, degenerate-element convention, derived orbit quantities"
status: in_review
requirement_ids: [ML-FR-002, ML-FR-003, ML-FR-009, ML-FR-010, ML-NFR-002, ML-NFR-003]
