  summary: >
    Element->state: P and Q are columns 1 and 2 of R_z(Ω) R_x(i) R_z(ω); p = (a(1 − e))(1 + e);
    r = p/(1 + e cos ν); position = (r cos ν) P + (r sin ν) Q; velocity = sqrt(μ/p)[(−sin ν) P +
    (e + cos ν) Q]. Order fixed and documented. No special-casing; angles not reduced; i = Math.PI
    gives a z component of relative size sin(Math.PI) ≈ 1.2e-16.
    State->elements: h = r × v, N = (−h_y, h_x, 0), e⃗ = ((v·v − μ/|r|) r − (r·v) v)/μ,
    ξ = v·v/2 − μ/|r|, a = −μ/(2ξ), e = |e⃗|. Angles (all atan2, then reduced to [0, 2π)):
    i = atan2(|N|, h_z); Ω = atan2(h_x, −h_y); ω = atan2((ref × e⃗)·ĥ, ref·e⃗) with ref = N
    (or +x when equatorial); ν = atan2((e⃗ × r)·ĥ, e⃗·r); circular: ω := 0 and
    ν := atan2((ref × r)·ĥ, ref·r) (argument of latitude, or true longitude when also
    equatorial); equatorial: Ω := 0. Detection: circular iff e = 0 or e < ε_e; equatorial iff
    |N| = 0 or min(i, π − i) < ε_i; thresholds are required parameters. e and i are never
    changed. Retrograde equatorial: substitute angles measured from the in-plane projection of +x
    positively about ĥ (direction of motion), which makes the round trip through the regular map
    with Ω := 0, i ≈ π consistent (no reflection). Open states: ξ > 0 returns a < 0, e, i, Ω, ω,
    ν (hyperbolic true anomaly) with conic 'HYPERBOLIC'; ξ = 0 exactly or overflowing |a| returns
    SEMI_MAJOR_AXIS_UNDEFINED; h = 0 exactly returns ZERO_ANGULAR_MOMENTUM.
    Derived quantities: r_p = a(1 − e), r_a = a(1 + e), T = 2π a sqrt(a/μ), n = (1/sqrt(a/μ))/a,
    ξ = −μ/(2a), |h| = sqrt(μ a(1 − e)(1 + e)) for closed orbits only (NOT_CLOSED_ORBIT
    otherwise); stateIntegrals gives ξ and |h| for any finite state with r ≠ 0.
    Sources: Wikipedia "Perifocal coordinate system" (perifocal r, v and the R_z(Ω)R_x(i)R_z(ω)
    matrix entries) and Wikipedia "Eccentricity vector" (section "Calculation"), both opened
    2026-11-13; everything else (orbit equation, vis-viva, node vector, inclination, periapsis /
    apoapsis, period, mean motion) derived in comments (D1–D7) from h = r × v, the eccentricity
    vector and the energy integral. Vallado (COE2RV/RV2COE) cited only as "not opened, not
    confirmed". No new physical constant.
