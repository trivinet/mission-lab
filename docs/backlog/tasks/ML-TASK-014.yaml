objective: >
  Provide pure, documented conversions between classical elements and the Cartesian state in
  packages/astrodynamics: element->state with the regular perifocal map (no special-casing, no
  re-normalisation), state->elements with the degenerate-element convention of architecture §3 as
  refined by ADR-008 (e and i always computed, convention flag in the output, atan2-based angle
  extraction), defined behaviour for open (e >= 1) states, angle normalisation to [0, 2π), and the
  derived quantities of ML-FR-002 AC4 / ML-FR-010 AC2.
scope:
  - "normalizeAngle_rad: [0, 2 * Math.PI), result rounding to 2π mapped to +0, −0 to +0, tagged failure for non-finite input (contracts-v1 §11 OQ-1)."
  - "elementsToState: regular map for 0 <= e < 1, 0 <= i <= π, fixed evaluation order, result object on visible precondition failure."
  - "stateToElements: thresholds as explicit parameters (no default), convention flag NONE | CIRCULAR | EQUATORIAL | CIRCULAR_EQUATORIAL, conic flag ELLIPTIC | HYPERBOLIC, atan2-based angles, documented retrograde-equatorial choice."
  - "closedOrbitQuantities (r_p, r_a, T, n, ξ, |h| for closed orbits; explicit NOT_CLOSED_ORBIT otherwise) and stateIntegrals (ξ, |h| for any state)."
  - "Unit tests: exact cases, invariants and round trips over the verification-plan §5 grid shapes, with provisional bounds derived in the test files."
out_of_scope:
