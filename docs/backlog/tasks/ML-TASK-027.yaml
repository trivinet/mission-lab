    - "docs/backlog/tasks/ML-TASK-027.yaml: this report"
  summary: >
    Plumbing only; no astrodynamics, contracts, apps/web, verification or tolerance change.
    DEGENERACY_THRESHOLDS = { circularEccentricity: 1e-5, equatorialInclination_rad: 1e-5 },
    transcribed from ADR-008 ("Thresholds and target value", owner 2026-11-13) and tolerances.md
    §10 / §15 (row "Thresholds ε_e, ε_i"). describeScenarioOrbit(elements, constants) returns
    Ω, ω, ν through normalizeAngle_rad; derived quantities from closedOrbitQuantities plus
    altitude = radius − referenceRadius_m; and the degenerate classification. Detection runs on
    the state, not on the input e and i: elementsToState (regular map) then stateToElements with
    DEGENERACY_THRESHOLDS, because ADR-008 decision 1 applies the convention only to
    state→elements and reports e and i as computed from the state; stateToElements implements the
    record's rule (strict e < ε_e and min(i, π − i) < ε_i, plus exactly degenerate e = 0 / node
    vector = 0). The description lists undefined elements and the meaning of each reported angle,
    restating the DegenerateConvention documentation of astrodynamics, and carries the elements the
    engine reports (convention applied). Failures are typed codes passed through from the
    astrodynamics functions plus NON_FINITE_INPUT and REFERENCE_RADIUS_NOT_POSITIVE.
    utcIsoAtElapsed(epochIso, t_s) gives the canonical YYYY-MM-DDTHH:MM:SS.sssZ of epoch + t_s
    under TIME_CONVENTION (no leap seconds), the offset rounded to the nearest millisecond
    (Math.round, halves toward +∞), with EPOCH_INVALID / NON_FINITE_TIME / OUT_OF_RANGE failures.
    Coordinator scope addition (message of 2026-11-16): ENGINE_CONSTANTS is the astrodynamics
    EARTH_CONSTANTS object that buildSimulationRequest copies into request.constants (no value
    retyped). earthRotationAngle_rad(epochIso, t_s) evaluates ADR-004's ERA = 2π(0.7790572732640 +
    1.00273781191135448·T_u) as written (TN36 Eq. 5.14, confirmed in vt-19-constants.md §4.3),
    UT1 ≈ UTC, T_u = (time value − J2000 time value)/86 400 000 + t_s/86 400, reduced by
    normalizeAngle_rad; documented as illustrative and display-only. The rate is written as
    1.0027378119113546, the shortest decimal of the binary64 value that 1.00273781191135448
    parses to (vt-19-constants.md §4.3 notes); a test asserts Number('1.00273781191135448') equals
    it. The Julian-date relation (Unix time = (JD − 2440587.5) × 86 400 s, leap seconds excluded)
    is from Wikipedia "Julian day" (accessed 2026-11-17), a secondary source; a test checks that
    Date.parse('2000-01-01T12:00:00.000Z') equals the derived J2000 time value 946 728 000 000 ms.
