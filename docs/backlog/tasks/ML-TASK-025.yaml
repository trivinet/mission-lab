  summary: >
    The panel shows dynamics model, central body, mu and reference radius with source, propagator,
    maneuver model, frame, epoch, time convention, engine version, duration, output step and every
    limitation, all read from SimulationResult.model. Numbers are shown in SI with their unit as
    String(value) (no conversion). Stale shows the old model marked stale. none, computing, stale
    without a result, and error show that there is no model. Details are a native details element
    (keyboard operable, global focus-visible). The not-qualified statement sits outside it, always
    visible.
