task_id: ML-TASK-025
title: "Model and assumptions panel rendered from SimulationResult.model (apps/web)"
status: review
requirement_ids: [ML-FR-012, ML-UX-004]
owner_role: frontend-engineer
reviewer_role: systems-architect
dependencies: [ML-TASK-017, ML-TASK-021]
affected_paths:
