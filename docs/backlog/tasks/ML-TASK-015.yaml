objective: >
  Provide the engine's analytical two-body propagator (ADR-005, option B): Stumpff functions and
  a universal-variable Kepler solve with Lagrange f, g, ḟ, ġ that advances a Cartesian state by
  any Δt for elliptic, parabolic and hyperbolic energy, with a stated stopping criterion,
  explicit failure results and diagnostics that let an external test check convergence.
scope:
  - "Stumpff functions C(ψ), S(ψ) (and c0, c1) for all real ψ: series near 0, closed forms elsewhere, switch-over and series length derived in the code."
  - "propagateKeplerUniversal(μ, r0, v0, Δt): direct evaluation from the initial state, no warm start, Δt = 0 returns a bit-identical copy (contracts-v1 §5.2 rev. 3)."
  - "Safeguarded Newton solve (bracketing + bisection fallback) with a hard cap and a stopping criterion at the rounding-noise floor of the time equation."
  - "Failure results INVALID_INPUT / NOT_CONVERGED / NON_FINITE_STATE (never thrown, never NaN in a success)."
  - "Thin helper propagateKeplerUniversalAt evaluating a list of times independently."
  - "Unit tests (self-consistency, L1) with explicitly derived provisional bounds."
