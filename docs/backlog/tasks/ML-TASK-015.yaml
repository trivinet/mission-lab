  known_limitations:
    - "Hyperbolic states whose position or velocity exceeds the binary64 range return NON_FINITE_STATE (or NOT_CONVERGED if cosh/sinh overflow before the root is bracketed). Stumpff values overflow to +Infinity for ψ < about −5.0e5."
    - "Near-parabolic ellipses with a tiny positive α need up to log2(1/(1 − e)) + 1 bracket doublings from the Curtis guess (measured 33 at e = 1 − 1e-10)."
    - "Phase (along-track) error grows linearly with |Δt| through the rounding of α = 2/r − v²/μ (data error, inherent to any method using this data) and the argument √(αχ²); the solver residual adds ≤ ~6u|Δt| (measured)."
    - "propagateKeplerUniversal does not emit contract diagnostics; mapping of NOT_CONVERGED → PROPAGATOR_NOT_CONVERGED and NON_FINITE_STATE → NON_FINITE_STATE (contracts-v1 §8.3) belongs to ML-TASK-017."
