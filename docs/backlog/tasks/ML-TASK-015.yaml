  summary: >
    Universal-variable propagator per ADR-005. Formulas are derived in the module comment from
    the two-body equation (α = 2/r − v²/μ; dχ/dt = √μ/r; r'' + αr = 1; universal Kepler
    equation; r_vec''' + α r_vec' = 0 giving f, g, ḟ, ġ; f ġ − ḟ g = 1 from conservation of h)
    and cross-checked against two sources that were opened (Weber, Orbital Mechanics &
    Astrodynamics, universal-anomaly page, Eqs. 251–255, 262, 266, 267; Wikipedia, Stumpff
    function and Universal variable formulation). g is formed as (σ0 χ² C + r0 χ c1)/√μ and ḟ
    as −√μ χ c1/(r r0), algebraically equal to the textbook Δt − χ³S/√μ and χ(ψS − 1) at the
    exact root, but consistent with the returned χ̂: the returned state is the point of the
    orbit at t(χ̂), so the solver residual is a pure along-track time shift and g does not
    carry a rounding that grows with |Δt|. Solve: documented initial guess (Curtis √μ α Δt for
    α > 0, √μ Δt/r0 clamped to |α|χ² ≤ 1 otherwise), bracket by doubling from 0, Newton with
    bisection fallback inside the bracket, cap 100. Each call depends only on its arguments;
    Δt = ±0 returns a component-wise copy.
  stopping_criterion_and_evidence:
    criterion: >
      F(χ) = σ0 χ² C + (1 − α r0) χ³ S + r0 χ − √μ Δt. At every evaluation the code forms
      η(χ) = 8u (|T1| + |T2| + |T3| + |√μ Δt|) + 2u |χ| |F'(χ)| (u = 2^-53), an estimate of the
      evaluation noise of the computed F plus the change of F across one binary64 spacing of χ.
      CONVERGED when |F̂(χ)| ≤ η(χ), or F̂ = 0, or the bracket has collapsed to ≤ 4u|χ|. After
      convergence up to 3 further Newton steps are taken and kept only while they strictly
      reduce |F̂| (polishing); the best point is returned. Otherwise, at the cap (100) or when a
      step cannot move χ: failure NOT_CONVERGED (iterationCapReached set when the cap ended it).
      No fixed absolute threshold is used. Diagnostics: iterations, bracketExpansions,
      iterationCapReached, universalAnomaly_sqrtm (χ̂), timeResidual_s = F̂(χ̂)/√μ (computed),
      timeResidualNoise_s = η/√μ, and timeEquation {alpha_per_m, sigma0_sqrtm, r0_m,
      oneMinusAlphaR0, sqrtMu_m1p5ps} so the exact time equation can be re-evaluated externally.
    measurement_method: >
      True residual |t(χ̂) − Δt| = |F(χ̂)|/√μ evaluated EXACTLY in the returned data (α̂, σ̂0, r̂0,
      (1 − αr0)^) with an exact √μ, using BigInt fixed-point arithmetic (10000 fractional bits,
      Stumpff series summed to convergence). Script kept outside the repository
      (scratchpad zz-measure.test.ts, run once with vitest, not committed). μ = EARTH_GM_m3ps2.
      States built from elements with Ω = 0.7, ω = 1.3 rad. Budget column: the derived budget
      ε_t = u[(25 + 65e)|Δt| + (12 + 114e + 130e²)/n] of the tolerance record under review
      (ML-TASK-010 branch, §6.1; not approved), quoted only for comparison.
    results_in_units_of_u_abs_dt: >
      Max over spans {0.1, 0.5, 1, 3.7, 10, −2.3, −10, 100} periods of true residual / (u |Δt|),
      and max ratio true/ε_t:
      circular LEO inclined (a 7000 km) 2.16, ratio 0.075;
      circular equatorial 1.37, 0.054;
      elliptical equatorial e 0.1 1.62, 0.050;
      moderately elliptical inclined e 0.3 1.76, 0.024;
      Molniya-like e 0.74 from perigee 1.52, 0.020;
      Molniya-like from apogee 1.85, 0.023;
      geostationary radius 1.53, 0.061;
      retrograde near-polar e 0.01 1.85, 0.072.
      Open/near-parabolic (spans 0.1…1000 × 1e4 s): hyperbola e 1.5 2.63 (ratio 0.029);
      hyperbola e 3 6.31 (ratio 0.070); e = 1 − 1e-6 2.82; e = 1 − 1e-10 1.71; e = 1 + 1e-6 3.01;
      e = 1 + 1e-10 2.31. Iterations used: 0–6 for closed orbits, 4–18 for open/near-parabolic;
      bracket expansions up to 33 for e = 1 − 1e-10 (bounded by log2(1/(1 − e)) + 1, derived in
      the code). Cap never reached. The computed residual reported in diagnostics is often
      exactly 0 while the true residual is ~u|Δt|: it is a computed quantity, not a bound.
    not_measured: >
      1000-period spans for closed orbits (the BigInt checker capped its series at 2000 terms,
      insufficient for ψ ≈ 4e7); the solver itself converged there.
