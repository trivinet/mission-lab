task_id: ML-TASK-004
title: "Normative simulation contracts v1.0 in packages/contracts (types + zod runtime schemas)"
status: in_review
requirement_ids: [ML-FR-002, ML-FR-004, ML-FR-005, ML-FR-006, ML-FR-011, ML-FR-012, ML-NFR-004]
owner_role: systems-architect
reviewer_role: astrodynamics-engineer   # also frontend-engineer and verification-engineer (backlog)
dependencies: [ML-TASK-003]
affected_paths:
  - packages/contracts/
  - docs/architecture/contracts-v1.md
  - docs/backlog/tasks/ML-TASK-004.yaml
objective: >
  The normative simulation contracts v1.0 in packages/contracts: TypeScript types plus zod 4
  runtime schemas for Scenario, SimulationRequest, TrajectorySegment, ManeuverEvent, Diagnostic,
  SimulationResult and their parts, matching approved architecture §4, with normative prose in
  docs/architecture/contracts-v1.md.
scope:
  - Types derived from schemas (single source of truth).
  - Schema for the persisted Scenario file (schemaVersion "1.0").
  - "Structural validation, each rule traceable to a requirement or ADR: finite numbers, eccentricity in [0,1),
    maneuvers length <= 1, duration_s > 0, outputStep_s > 0, maneuver time within [0, duration_s]."
  - Typed-array fields validated for type and consistent lengths (N, 3N).
  - Stable machine-readable diagnostic/validation code list.
  - Precise requestId definition; hashing implementation may be deferred to ML-TASK-017 if non-trivial.
out_of_scope:
  - Any physics (element/Cartesian conversion, constants values), engine, UI.
  - Changes to architecture; ambiguities go to "Open questions for the owner".
  - New dependencies or lockfile changes.
inputs:
  - AGENTS.md
  - docs/architecture/proposed-architecture.md (§2, §3, §4)
  - docs/architecture/adr/ADR-002, ADR-004, ADR-005
  - docs/requirements/m1-requirements.md
  - docs/product/ML-SYS-001.md Appendix A (A.2)
  - docs/verification/m1-verification-plan.md
  - eslint.config.js
acceptance_criteria:
  - "`pnpm lint`, `pnpm typecheck`, `pnpm test`, `pnpm format:check`, `pnpm check:boundaries` exit 0."
  - "Schema tests cover: valid scenario round-trip; each validation rule rejecting with its code; unknown
    schemaVersion rejected; non-finite numbers rejected; typed-array length mismatch rejected."
  - "packages/contracts imports nothing internal and nothing but zod."
  - "Every physical field name carries its unit suffix."
test_requirements:
  - Vitest schema tests in packages/contracts/src/*.test.ts.
deliverables:
  - packages/contracts schemas, types, validators, canonical requestId payload, code registry, tests.
  - docs/architecture/contracts-v1.md.
human_approval_required: true   # open questions OQ-1..OQ-8 and deviations D-1..D-5 need owner decisions

