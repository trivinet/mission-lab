  summary: >
    Contract v1.0 implemented as zod 4 strict schemas with inferred types. Validators never throw and
    return {code, path, message} issues with stable codes. Result schema checks typed-array class,
    N/3N lengths, finiteness, ordering and segment/event/status invariants. requestId is specified
    (SHA-256 of a canonical JSON payload); the canonical payload is implemented and tested, the
    SHA-256 step is deferred to ML-TASK-017 (contracts-v1.md §7.3). Five additive deviations from
    §4 and eight open questions are documented in contracts-v1.md §10-§11.
