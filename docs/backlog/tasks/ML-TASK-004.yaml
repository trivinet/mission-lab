    - "Cross-realm typed arrays (instanceof Float64Array across iframes) not tested; worker structured clone assumed to create arrays in the receiving realm."
    - "Date.parse/toISOString round-trip for epochs relies on the ECMAScript Date Time String Format; tested on Node 24 only, not in browsers."
    - "Reviews by Astrodynamics, Frontend and Verification Engineers (backlog acceptance) have not happened."
