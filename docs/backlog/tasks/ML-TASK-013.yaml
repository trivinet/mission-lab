objective: >
  Provide the Earth constants (gravitational parameter, reference radius) with a documented
  source, shaped like the contract's `constants` record, and pure, documented 3-vector and 3x3
  matrix operations that ML-TASK-014/015/016 build on. VT-01 unit tests.
scope:
  - "Constants module: EARTH_GM_m3ps2, EARTH_REFERENCE_RADIUS_m, EARTH_CONSTANTS { mu_m3ps2, referenceRadius_m, source }, each with a cited source."
  - "Vec3 operations on readonly tuples: add, subtract, scale, dot, cross, norm, normalize (zero-vector behaviour defined, no NaN)."
  - "Mat3 operations: matrix-vector product, transpose, matrix-matrix product."
  - "Vitest unit tests for VT-01 identities, exact cases and edge cases, with explicitly derived provisional bounds."
out_of_scope:
  - Any other physical constant (Earth rotation angle coefficients, J2, flattening).
  - Degree/radian conversion and angle normalisation (owner open: contracts-v1 NQ-3).
  - Display unit conversion (km, km/s, deg): UI formatting layer.
  - Official tolerances (ML-TASK-010) and VT-19 reference confirmation (Verification Engineer).
  - New dependencies or lockfile changes; any edit to verification/ or test-data/.
