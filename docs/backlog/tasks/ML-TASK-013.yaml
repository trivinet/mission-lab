    - "packages/astrodynamics/src/vector3.test.ts (new): 32 tests (VT-01)"
    - "docs/backlog/tasks/ML-TASK-013.yaml (new): this contract and report"
  summary: >
    Constants: GM = 3.986004418e14 m^3/s^2 (WGS 84 defining parameter, mass of the atmosphere
    included; not the GPS value 3.9860050e14) and reference radius = WGS 84 semi-major axis
    6378137 m, both read from an NGA-authored publication of the four WGS 84 defining parameters
    (NGA, "World Geodetic System 1984", UN ICG reference-frame description, 2012, p. 2,
    defining-parameters table, https://www.unoosa.org/pdf/icg/2012/template/WGS_84.pdf, accessed
    2026-11-12). NGA.STND.0036 / NIMA TR8350.2 itself was not reachable (earth-info.nga.mil timed
    out; an archived copy returned HTTP 429), so confirmation against that text remains open for
    VT-19. Values match proposed-architecture §3 and are exact binary64 integers.
    Vector math: pure functions on readonly tuples with a fixed, documented evaluation order
    (no FMA in ECMAScript, so results are bit-reproducible). normVec3 uses the naive
    sqrt((x*x + y*y) + z*z) when the sum of squares lies in [2^-1000, 2^1000] and otherwise
    rescales by an exact power of two (2^-600 / 2^600) to avoid overflow and underflow; Math.hypot
    is not used because its algorithm is implementation-defined. normalizeVec3 returns
    { ok: true, unit } or { ok: false, reason: 'ZERO_VECTOR' | 'NON_FINITE_NORM' } and never NaN.
    Other primitives propagate IEEE 754 non-finite values; finiteness checks belong to the caller.
  tests_executed:
    - "pnpm exec vitest run --project astrodynamics -> exit 0; 3 files, 38 tests passed (1 placeholder, 5 constants, 32 vector3)"
    - "pnpm lint -> exit 0"
    - "pnpm typecheck -> exit 0 (root + all 5 workspaces)"
    - "pnpm test -> exit 0; 12 files, 375 tests passed"
    - "pnpm format:check -> exit 0"
    - "pnpm check:boundaries -> exit 0; 12/12 fixtures reported"
  reference_data_used:
    - "NGA, World Geodetic System 1984, UN ICG reference-frame description (2012), p. 2, defining-parameters table: https://www.unoosa.org/pdf/icg/2012/template/WGS_84.pdf (accessed 2026-11-12)"
  not_verified:
    - "VT-19: the constants against NGA.STND.0036 / NIMA TR8350.2 (primary standard not reached). The source read is an NGA-authored summary that cites TR8350.2."
    - "VT-01 against the approved tolerance record: the bounds in vector3.test.ts are the implementer's provisional derivations (standard model, u = 2^-53, gamma(k) = k u / (1 - k u)); they must be replaced by the ML-TASK-010 record. Bound constants: orthogonality gamma(3)/gamma(2) termwise; parallel cross (gamma(2) + u/(1-u)) t_i; Lagrange 32u |a|^2|b|^2; triple product 16u |a||b||c|; unit norm gamma(9); rotation norm 16u|v|; rotation product orthogonality 24u, norm 32u|v|."
    - "No independent (L2) or external (L3) check of VT-01 exists yet; the tests here are L1 by the implementer."
    - "Math.sqrt correct rounding is assumed (IEEE 754, hardware sqrt); the ECMAScript text was not checked for this guarantee."
    - "The gamma(k) accumulation lemma is the standard one (Higham, Accuracy and Stability of Numerical Algorithms, 2nd ed., ch. 3); the citation was not checked against the book in this task."
  known_limitations:
    - "normVec3 of a finite vector whose true norm exceeds Number.MAX_VALUE returns +Infinity (normalizeVec3 reports NON_FINITE_NORM)."
    - "Signed zeros follow IEEE 754 and are not normalised (e.g. the identity matrix maps -0 to +0)."
  documentation_changes:
    - "None outside the code and this task file."
  risks_or_blockers:
    - "VT-19 source: if the owner or Verification Engineer requires NGA.STND.0036 / TR8350.2 itself, the constants remain unconfirmed until someone retrieves it. Changing EARTH_CONSTANTS_SOURCE later changes every requestId (contracts-v1 §4, §7)."
    - "Angle helpers (degToRad, normalizeAngle_rad) are unassigned (contracts-v1 NQ-3). Recommendation: radian-domain normalisation into [0, 2π) is needed by the engine for derived elements (ML-TASK-014) and fits packages/astrodynamics; degree conversion is display and belongs to the UI formatting module. Not implemented pending the Coordinator's assignment."
  review_artifact: ""
  recommended_next_action: >
