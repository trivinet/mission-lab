objective: >
  Provide the G3 evidence that the analysis module's outputs are correct: VI-03 (b) per-sample
  correctness against an independent recomputation, and ML-FR-010 AC3 comparison-table values
  against independent references, both under the approved tolerance record.
scope:
  - "Phase 1 (no engine or analysis-module output seen): independent reference recomputation in verification/src (L2c forms as tolerances.md §8 VI-03 (b) prescribes: atan2 forms, high precision where the record says so; it must not import or call the analysis module or packages/simulation). Datasets in test-data/reference-cases/ (new files only) with per-sample tolerances evaluated from the reference side per tolerances.md §8 VI-03 (b) table and, for the comparison table, the FR-010 AC3 rows of §7 VT-15; samples within a factor 2 of a §10 threshold excluded as the record says. Conformance tests in conformance/ that will compare computeHistories and compareCoastAndManeuver outputs with the datasets. All committed before any run of the analysis module on these cases (§4.1)."
  - "Phase 2: run, report in docs/verification/conformance-run-5.md (families, cases, worst ratios, asserted vs informative, limits, findings). A failure is investigated (reference defect vs module defect) and reported; nothing in packages/ is changed; references are corrected only as new versions with the reason stated, never loosened."
  - "Cases: at least the default scenario, a tangential burn, a non-tangential burn, an inclined eccentric orbit (C4-like), a Molniya-like orbit (C5-like) and one post-maneuver hyperbolic case for the quantities defined there."
out_of_scope:
  - "Changing tolerances.md (if a needed row is missing or ambiguous, stop and report; a new revision needs the owner)."
  - "Changing packages/ or apps/web."
  - "New dependencies."
