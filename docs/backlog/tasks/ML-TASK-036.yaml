  summary: >
    Phase 1 (d7be9dd, 0122162, 39d3152; boundary 894ad6b): independent reference of the analysis
    quantities of one state (200-bit in-plane polar formulation with the ADR-008 convention,
    validated against the binary64 e-vector formulation within M x the per-side budgets, against
    known elements and against the earlier L2c view); six datasets (default, tangential, combined,
    C4 normal burn, C5 prograde, post-maneuver hyperbolic) with the §5.2 grid, a 200-bit reference
    trajectory and per-sample tolerances evaluated from it (§4.1 items 1-2); a conformance test that
    runs buildSimulationRequest/buildCoastRequest, computeHistories and compareCoastAndManeuver and
    compares every value with the reference recomputed from the same engine state. Phase 2: every
    asserted comparison passed (1 217 history samples x 10 rows, 5 comparison tables, applied Δv);
    worst ratio 0.0897 (Ω history, C5). No defect found. Quantities without an approved row
    (e, ω, ν on hyperbolic states; r_p, r_a, T histories; hyperbolic r_p; convention-assigned
    angles) stayed informative; see conformance-run-5.md §4.
