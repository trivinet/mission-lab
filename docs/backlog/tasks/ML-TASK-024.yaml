task_id: ML-TASK-024
title: "Timeline and playback with display interpolation (apps/web)"
status: in_progress
requirement_ids: [ML-FR-008, ML-UX-004]
owner_role: frontend-engineer
reviewer_role: verification-engineer   # FR-008 AC2/AC3 are integration/unit checks of displayed values
dependencies: [ML-TASK-023]
affected_paths:
  - apps/web/src/playback/
  - apps/web/src/scene/          # marker position from the playback time only; no change to the trajectory geometry or the scale
  - apps/web/src/layout/CenterRegion.tsx   # mount the timeline under the scene
  - apps/web/src/state/          # additions only: playback time, play state, rate; never the five-state result rules
