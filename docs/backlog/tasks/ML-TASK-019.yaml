  summary: >
    RECTILINEARITY RULE (R1). A state is rectilinear iff the EXACT cross product of the given
    binary64 r and v is zero (no tolerance). Each 2×2 minor r_i v_j = r_j v_i is tested: if the
    rounded products differ the exact ones differ (round-to-nearest is monotone), so h ≠ 0; if
    each side has a zero factor both are 0; otherwise the products are compared exactly with
    BigInt (x = N·2^-1074). Why: a tiny non-zero h is a genuine conic with r_p > 0 that the
    universal formulas propagate correctly, so it must not be reclassified; in particular a
    computed r × v that is zero only because the products rounded equal is NOT rectilinear (test
    with r = 2^23(1+2^-52, 1, 0), v = −2^10(1+2^-51, 1+2^-52, 0)). Conversely exact h = 0 always
    gives a computed zero, so no rectilinear state escapes the rule.
    COLLISION TIME (R2, R3; derived from the energy integral, no source opened). With σ = r ṙ/√μ,
    energy gives σ² = 2r − αr² and σ → 0 at r = 0. Measuring the universal anomaly from a passage
    through the centre, (D2)–(D4) give r = χ²c2(αχ²), σ = χ c1(αχ²), √μ(t − t_centre) = χ³c3(αχ²).
    Time from the centre to r₀ on the outgoing branch (= from r₀ incoming to the centre):
    t* = χ*³c3(αχ*²)/√μ with χ* = (2/k)atan2(k r₀, |σ₀|) (α > 0, k = √α), (2/k)asinh(k√(r₀/2))
    (α < 0, k = √−α), √(2r₀) (α = 0). Period for α > 0: T = 2π/(k³√μ). Forward: σ₀ < 0 → t*;
    σ₀ ≥ 0 and α > 0 → T − t*; σ₀ ≥ 0 and α ≤ 0 → none. Backward (Δt < 0) is the mirror
    (σ₀ → −σ₀). Fall from rest: t = T/2 = (π/2)√(r₀³/(2μ)), cross-checked in the comment with the
    elementary integral (r = r₀ sin²θ). Decision: fail iff rectilinear and t_c exists and
    t_c ≤ |Δt| (equality counts, conservative); collisionDeltaT_s = ±t_c. A non-finite computed
    t_c (overflow, only far outside M1 ranges) gives NON_FINITE_STATE. The check uses the same
    α̂, σ̂₀, r̂₀, √μ as the solver and only reads data; the solver arithmetic is untouched.
    NORMAL PATH: bit patterns of 10 propagations (ellipse fwd/back, e≈0.99 through periapsis,
    hyperbola, near-rectilinear h = 7 m²/s through periapsis, 5 rectilinear cases that do not
    reach the centre within Δt) were printed on c1bba42 by a temporary probe (not committed) and
    are asserted bit-for-bit as fixtures; the full suite including the 124 conformance tests
    passes unchanged.
    RUNNER. Collision → NON_FINITE_STATE, t_s = segment start + collisionDeltaT_s, message "…the
    trajectory is rectilinear (position x velocity = 0) and reaches the centre of the central body
    (r = 0) at t_s ≈ <9 significant digits> s, where the state is singular; the run cannot continue
    past it." After a maneuver the intersection check (span = last sample Δt ≥ every sample Δt)
    meets the collision first (D8 path), so no REFERENCE_SPHERE_INTERSECTION is emitted for that
    maneuver; an ESCAPE_TRAJECTORY warning for it (unbound incoming motion) would be kept first.
    Scenario "circular equatorial a = 7e6 m, all angles 0, maneuver at t = 0 with RSW Δv
    (0, −v_y, 0)" (velocity after = 0 exactly; fall time 1030.3459096915992 s): duration 1200 s →
    status failed, diagnostics exactly [{NON_FINITE_STATE, error, t_s = 1030.3459096915992}];
    duration 1000 s → status ok, diagnostics exactly [{REFERENCE_SPHERE_INTERSECTION, warning,
    t_s = 0, reason INSIDE_AT_END}]; duration 100 s → ok, no diagnostics.
    −0 NORMALISATION. normalizeNegativeZero (deep, every number) is applied twice in
    buildSimulationRequest: on the validated scenario before elementsToState (so equivalent
    scenarios take the same arithmetic path), and on the assembled request (so engine-produced −0
    — e.g. all-zero elements give velocity_mps[0] = −0 — never reaches the request). Validation
    outcomes are unaffected (±0 behave the same under ≥ 0 / > 0). computeRequestId itself still
    distinguishes ±0 (contract §7.2). Segment 0's first sample stays bit-identical to
    request.initialState (tested with the all-zero-elements scenario).
    TESTS CHANGED (superseded behaviour): request.test.ts 'keeps −0 inputs unchanged (contracts-v1
    §12 NQ-1 not decided)' → 'maps −0 inputs to +0'; request.test.ts 'distinguishes −0 from +0
    (owner decision 8)' → 'equivalent scenarios differing in the sign of a zero get the same
    requestId' (plus a new test that computeRequestId still distinguishes them); run.test.ts
    'maneuver at −0: sample time −0 in both segments, event t_s −0' — assertions unchanged, but
    its request is now given in Cartesian form (cartesianRequest) because the builder no longer
    produces a −0 maneuver time.
    CHOICES MADE: (a) the rectilinearity line is exact h = 0 (no band); (b) the collision failure
    carries collisionDeltaT_s as a separate union member so existing failure shapes are
    unchanged; (c) the runner diagnostic t_s is the collision time, not the maneuver time;
    (d) normalisation is applied both before conversion and on the request; (e) a non-finite
    collision time → NON_FINITE_STATE.
