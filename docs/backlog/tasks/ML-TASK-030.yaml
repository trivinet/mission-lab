task_id: ML-TASK-030
title: "Charting library spike (OD-006) and ADR-010 (proposed)"
status: in_review
requirement_ids: [ML-FR-009, ML-FR-010, ML-NFR-004, ML-NFR-006, ML-NFR-007, ML-UX-004]
owner_role: frontend-engineer
reviewer_role: systems-architect
dependencies: [ML-TASK-026]
affected_paths:
  - spikes/charting/                 # throwaway spike code, not part of the app build or CI
  - docs/architecture/adr/ADR-010-charting-library.md
  - docs/backlog/tasks/ML-TASK-030.yaml
objective: >
  Close open decision OD-006 (ADR-006, proposed-architecture §5): choose the charting library for
  the M1 time-history plots and the coast-vs-maneuver comparison, on evidence, and propose it as
  ADR-010 for the owner. (The backlog line says "ADR-008"; that number is taken by the
  degenerate-elements ADR, so this is ADR-010.)
scope:
  - "Shortlist 2–4 candidates that are maintained, permissively licensed and usable from React 19 without a server (for example uPlot, Apache ECharts, Recharts, Plotly basic). Record version, licence, bundle size (min+gzip), last release date and maintenance signals from the npm registry or the project's own site; cite each source and the date read. Do not write any of these from memory."
  - "Representative data: real engine results through `@mission-lab/simulation` (the default scenario, a maneuvered one, and a large run near the 250 000 soft-warning size), giving 6–10 series (radius, altitude, speed, true anomaly, a, e, i…) split at the maneuver."
  - "For each candidate, a small spike page in spikes/charting/ (its own package.json or a vite entry outside apps/web; nothing added to apps/web) that renders: two series with a gap at the maneuver (no line across the discontinuity), a vertical maneuver marker, axis titles with units and a legend (FR-009 AC2), a moving time cursor driven from outside (playback t_s), and coast vs maneuvered overlaid with distinct styles (FR-010 AC1)."
  - "Measure per candidate on the same machine: first render time and cursor update time at about 1e4 and about 2.5e5 points per series, memory if available; keyboard and screen-reader support stated from the library's docs (cited); whether exact values can be read back for the FR-009 AC3 / VI-03 plumbing check (Object.is on plotted values)."
  - "ADR-010 (status Proposed): context, options with the measured table, decision recommended, consequences (dependency added to apps/web, tech-baseline update needed, CSP/no-network constraints, licence)."
out_of_scope:
  - "Adding any dependency to apps/web or the lockfile of the app; the chosen library is added by ML-TASK-032 after the owner approves the ADR."
  - "Any change to packages/, apps/web/src, CI, or other ADRs."
inputs:
  - AGENTS.md; docs/engineering/coding-standards.md
  - docs/architecture/adr/ADR-006-frontend-stack.md (OD-006), ADR-002
  - docs/architecture/proposed-architecture.md §5–§6; docs/architecture/tech-baseline.md (how versions are pinned and justified)
  - docs/requirements/m1-requirements.md (FR-009, FR-010, NFR-004, NFR-006, NFR-007, UX-004)
  - docs/verification/tolerances.md §1 row "Plotted values vs the analysis module's output" (VI-03 plumbing, Object.is)
  - docs/verification/performance-envelope.md (sizes, machine)
  - docs/design/design-tokens.md (colours for coast/maneuvered)
acceptance_criteria:
  - "Each candidate has a spike that runs with one documented command and shows the five features listed in scope, or the report states which it could not do and why."
  - "A measurement table (≥ 3 repetitions per point, median) and the cited metadata per candidate are in ADR-010."
  - "ADR-010 is Proposed, recommends one library with reasons, and lists what changes if approved."
  - "`pnpm lint`, `pnpm typecheck`, `pnpm test`, `pnpm format:check`, `pnpm check:boundaries` still exit 0 on the branch (spikes excluded from them if needed, with the exclusion stated)."
test_requirements:
  - "No product tests; the spike's measurements are the evidence."
deliverables:
  - spikes/charting/, ADR-010 (Proposed), the report section of this file
human_approval_required: true   # owner approves ADR-010 and the new dependency

report:
  files_changed:
    - spikes/charting/ (new; own package.json and package-lock.json, README.md, vite.config.js, four pages, adapters, shell, tools/, results/, data/manifest.json)
    - docs/architecture/adr/ADR-010-charting-library.md (new, Proposed)
    - docs/backlog/tasks/ML-TASK-030.yaml (this report)
    - eslint.config.js (one ignore entry, 'spikes/**'; this file is not in affected_paths, the coordinator allowed the exclusion "if needed" and it was needed, see known_limitations)
  summary: >
    Four candidates (uPlot 1.6.32, ECharts 6.1.0, Plotly basic 4.3.0, Recharts 3.10.1) were built
    as spike pages and run on real engine data (default scenario, a maneuvered run, 10 000 and
    250 000 samples, 8 series each, split at the maneuver). All four show the gap, marker, axis
    titles with units, legend, external cursor and coast/maneuvered overlay, and all passed an
    Object.is read-back of the plotted values (0 mismatches). Medians of 3 repetitions are in
    ADR-010. Recommendation: uPlot 1.6.32 (250 000 points, 8 charts: 364 ms render, 0.1 ms cursor,
    36 MB heap, 23.9 kB gzip); ECharts is the runner-up. ADR-010 is Proposed. Nothing was added to
    apps/web or to the root lockfile.
  tests_executed:
    - "pnpm install --frozen-lockfile (repository root): ok, lockfile unchanged"
    - "pnpm lint: exit 0 (with the 'spikes/**' ignore)"
    - "pnpm typecheck: exit 0"
    - "pnpm test: 90 files, 1792 tests passed"
    - "pnpm format:check: All matched files use Prettier code style!"
    - "pnpm check:boundaries: 20/20 fixtures reported, exit 0"
    - "spikes/charting: node tools/gen-data.mjs (3 datasets from engine runs); npx vite build; node tools/smoke.mjs small and n2_5e5 (Object.is read-back 0 mismatches for all four, screenshots inspected); node tools/measure.mjs (3 reps, ladder 1e4 and 250 000, single and panel) and SPIKE_SIZES=small; node tools/size.mjs; node tools/probe.mjs"
  reference_data_used:
    - "Real engine runs via @mission-lab/simulation runSimulation (request ids in spikes/charting/data/manifest.json). Derived series (radius, altitude, speed, elements) were computed in the spike generator with the engine's stateToElements; they are plumbing inputs, not reference values."
    - "npm registry (read 2026-11-17 12:55 UTC) and repository API for version, licence, dates, issues, release counts; ECharts handbook aria page read 2026-11-17; recharts type declarations (accessibilityLayer)."
  not_verified:
    - "Other machines, a real GPU, Firefox and Safari; all numbers are one loaded Windows PC, headless Chromium 156, software WebGL."
    - "Real screen-reader behaviour; only DOM attributes and Tab order were probed. Recharts arrow-key behaviour not exercised."
    - "Any Content-Security-Policy header; only absence of eval/new Function in the bundles and absence of external requests was checked."
    - "ECharts getOption() read-back, down-sampled plotting, the 1 000 000-sample hard limit, Recharts panel at 250 000 (timed out at 240 s on the first repetition)."
    - "The analysis module (ML-TASK-031) does not exist yet; derived series were produced by the spike."
    - "Heap figures exclude canvas and GPU memory and data buffers; the 0.1 ms cursor figure is the timer resolution floor."
  known_limitations:
    - "eslint.config.js was edited (one ignore entry for spikes/**) because the spike's plain JS uses browser and Node globals that the repository's no-undef rule rejects. Prettier is not excluded: the spike is formatted and checked."
    - "uPlot and Recharts express the maneuver gap as two series on a shared x grid; ECharts and Plotly use one series with a gap element."
    - "Angle series (true anomaly, RAAN) jump at the 0/2pi wrap in every library; the data layer must decide how angles are plotted (observation recorded in ADR-010)."
  documentation_changes:
    - "ADR-010 added (Proposed). tech-baseline.md, proposed-architecture.md and ADR-006 are NOT changed; ADR-010 lists the updates needed if approved."
  risks_or_blockers:
    - "Owner decision: approve ADR-010 and the uplot dependency (human_approval_required)."
    - "uPlot maintenance risk (no npm release since 2025-03-14); accepted explicitly or fall back to ECharts."
  review_artifact: ""
  recommended_next_action: "Systems Architect reviews ADR-010; owner approves or picks ECharts; then ML-TASK-032 adds the chosen dependency. Decide the angle-wrap plotting policy in ML-TASK-031/032."
