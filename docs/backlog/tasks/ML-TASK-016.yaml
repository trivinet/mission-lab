task_id: ML-TASK-016
title: "RSW basis, impulsive maneuver and post-maneuver trajectory flags in packages/astrodynamics"
status: in_review
requirement_ids: [ML-FR-005, ML-FR-006, ML-NFR-002, ML-NFR-003]
