  summary: >
    RSW basis per architecture §3 evaluated as R = normalizeVec3(r), h = crossVec3(r, v),
    W = normalizeVec3(h), S = crossVec3(W, R) (no re-normalisation). Δv_I[i] = (ΔvR R[i] + ΔvS
    S[i]) + ΔvW W[i]; v⁺[i] = v⁻[i] + Δv_I[i] (one addition, so R12 holds bit-exactly by
    construction); |Δv| = normVec3(Δv_I); position and v⁻ are component copies (Object.is
    identical). Zero Δv: every Δv_I component is ±0 (−0 exactly when all three products of its
    row are −0); v⁺ === v⁻ always; bit-identity fails only for a component where v⁻ is −0 and Δv_I
    is +0 (v⁺ becomes +0); R12/R8 are unaffected because v⁺ is by definition that sum and the next
    segment copies v⁺. Escape: sign of the specific energy (equivalent to e ≥ 1 for h ≠ 0), with
    the derived evaluation-error bound η = 6u(v²/2 + μ/|r|): CLOSED if ξ̂ < −η, OPEN if ξ̂ > η,
    NEAR_PARABOLIC otherwise; flagged unless CLOSED. Intersection: exact characterisation of
    min |r| over [0, D] (start, end, next periapsis passage) with r_p = p/(1 + e) from the
    eccentricity vector and t_p from the universal-variable time equation at the closed-form
    periapsis anomaly χ_p (atan2 / atanh / linear by sign of α); end radius from
    propagateKeplerUniversal(μ, r, v, D). No sampling and no root solve.
  design_choices_for_owner_approval:
    - "D1 Escape criterion = sign of the specific energy ξ = v·v/2 − μ/|r|, not the computed |e_vec|. Equivalent to e ≥ 1 whenever h ≠ 0 (derived: |e|² = 1 + 2ξh²/μ²). For rectilinear states (h = 0) e = 1 formally for every energy; the energy rule flags them only if ξ ≥ 0. Alternative: compare |e_vec| with 1 (literal reading of contracts-v1 §8.3 and ML-FR-006 AC6), which is worse conditioned near e = 1 and flags bounded rectilinear motion."
    - "D2 Rounding rule for escape: flag unless the exact energy of the given binary64 state is provably negative (ξ̂ < −η, η = 6u(v²/2 + μ/|r|), derived from the evaluation order under the A2 assumption, not a tuning epsilon). Near-parabolic states within the evaluation noise (including exactly parabolic) are flagged and reported as regime NEAR_PARABOLIC. Alternatives: flag iff ξ̂ ≥ 0 (no band; outcome inside the noise follows rounding), or flag only when provably open."
    - "D3 Intersection = 'some t in [0, D] has |r(t)| ≤ R', decided analytically from |r(0)|, |r(D)| and the first periapsis passage (t_p ≤ D and r_p ≤ R). Only the first periapsis matters on closed orbits; open orbits have at most one passage (none when moving outward). D is the post-maneuver arc length (ML-TASK-017 passes the same Δt it uses for the segment's last sample, so INSIDE_AT_END agrees with that sample bit-for-bit). Alternative readings: 'periapsis radius below R' regardless of span (simplest, flags passages after the end of the run), or sample-based (rejected by tolerance record O-5)."
    - "D4 Boundaries are inclusive: start exactly on the sphere, a tangent orbit (r_p = R) and a periapsis passage exactly at D all count as intersecting."
    - "D5 No rounding band on r_p, t_p or |r(D)|: within their evaluation error the decision follows the computed values (unlike D2, no rigorous bound on r_p was derived; it would involve κ_h). VT-16 case selection (|r_p − R| ≥ 1e-6 R) keeps tests away from this."
    - "D6 The first crossing time (|r| = R) is not computed; the result carries the flag, its reason (INSIDE_AT_START / PERIAPSIS_BELOW_REFERENCE_IN_SPAN / INSIDE_AT_END), r_p, t_p, |r(0)| and |r(D)|. ML-TASK-017 decides the Diagnostic t_s (contracts-v1 §8.3 sets t_s only for ESCAPE_TRAJECTORY)."
    - "D7 Zero Δv is not special-cased: the fixed evaluation order is kept, so a −0 velocity component can become +0 (=== preserved, Object.is not). Alternative: return Δv_I = [−0, −0, −0] when all RSW components are zero (−0 is the exact additive identity), making v⁺ bit-identical to v⁻."
    - "D8 Failure of the intersection check (propagation to D failed, or an existing periapsis time overflowed) is returned as a failure result, not as 'no intersection'. ML-TASK-017 maps it (the propagation failure would fail the segment anyway)."
