objective: >
  Provide the engine functions for the M1 maneuver: the RSW basis of a state, the application of
  an impulsive Δv given in RSW components with the contract's bit-exact boundary rules (R8, R12),
  and analytical classification of the post-maneuver trajectory for the runtime warnings
  ESCAPE_TRAJECTORY and REFERENCE_SPHERE_INTERSECTION (ML-FR-006 AC6), whose detection semantics
  are open in the approved documents (tolerance record O-5) and are proposed here for owner
  approval.
scope:
  - "rswBasis(r, v): R = r/|r|, W = (r×v)/|r×v|, S = W×R with fixed evaluation order; failure result (no throw, no NaN) for r = 0, r×v = 0, non-finite input, overflow."
  - "rswToInertial(basis, x_rsw): fixed-order resolution (x_R R[i] + x_S S[i]) + x_W W[i]."
  - "applyImpulsiveManeuver(r, v⁻, Δv_RSW): position and v⁻ copied, Δv_I, v⁺ = v⁻ + Δv_I as one addition per component, |Δv| = norm of Δv_I; output fields map one-to-one onto ManeuverEvent (contracts-v1 §5.3)."
  - "classifyEscape(r, v, μ): energy-sign criterion with a derived evaluation-error bound."
  - "detectReferenceSphereIntersection(r, v, μ, R, D): analytical min of |r| over [0, D] from start, end and the next periapsis passage."
  - "Unit tests (self-consistency, L1) with derived bounds or approved tolerances."
